services:
  # Frontend — statikus PWA (Vite build)
  - type: web
    name: vizsgamester
    env: static
    buildCommand: npm install && npm run build
    publishDir: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Backend — Node.js Express API (auth + sync)
  - type: web
    name: vizsgamester-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false  # manuálisan kell beállítani a Render dashboard-on
      - key: FRONTEND_URL
        value: https://vizsgamester.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: vizsgamester-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'

# PostgreSQL adatbázis
databases:
  - name: vizsgamester-db
    plan: free
